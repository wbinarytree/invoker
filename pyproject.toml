[project]
name = "invoker"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "wbinarytree", email = "11wangyaoda@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.120.0",
    "google-genai>=1.73.1",
    "httpx>=0.28.1",
    "networkx>=3.6.1",
    "pydantic>=2.13.0",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "typer>=0.24.1",
]

[project.scripts]
invoker = "invoker.cli:app"

[build-system]
requires = ["uv_build>=0.11.6,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.408",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.10",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "basic"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --import-mode=importlib"
asyncio_mode = "auto"
