# Dota documentation and set reviewed_by / reviewed_at after each pass.
patch: "7.41b"
reviewed_by: null
reviewed_at: null
mechanics:
  - stat: strength
    contributions:
      - description: "HP per point"
        value: 22
        unit: HP
      - description: "HP regeneration per second per point"
        value: 0.1
        unit: HP/s
  - stat: agility
    contributions:
      - description: "armor per point"
        value: 0.167
